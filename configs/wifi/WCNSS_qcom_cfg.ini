# WCN7750 (SM8735 / POCO F7 "onyx") WLAN Driver Configuration
#
# Audited against qca_cld3_wcn7750.ko (1,239 live compiled-in CFG_INI_* symbols),
# /proc/device-tree/soc/qcom,wcn7750/, /vendor/firmware_mnt/image/wcn7750/Data.msc,
# and /vendor/bin/cnss-daemon.
#
# Design goal:
#   1. Uncapped RX/TX throughput and minimal latency during active traffic
#      (SNOC 403 MHz / LPDDR5 3.2 GHz bus scaling, WDCVS dynamic voltage corner,
#       low REO RX interrupt coalescing, 64-bit WLM LSR, uncapped NAPI/reap loops,
#       multi-core DP load/flow balancing, full Wi-Fi 7 eMLSR/MLO/160-320MHz PHY).
#   2. Maximum standby/idle battery efficiency with zero active throughput penalty
#      (IMPS/BMPS, dynamic PHY retention, suspend-only modulated/telescopic DTIM,
#       APF/WoW/RA/ICMP/IGMP/multicast firmware offloads, dynamic bus scale-down).
#   3. Zero duplicates, zero out-of-range values, zero placebos (all eliminated
#      placebos and driver traps are documented at the bottom of this file).

################ 1. Core 802.11, Band, & Channel Bonding ################

# Auto dot11 mode: enables 802.11be (Wi-Fi 7) / 11ax / 11ac / 11n
gDot11Mode=0

# Unlock all bands: 1=2.4G, 2=5G, 3=2.4G+5G, 7=2.4G+5G+6GHz
BandCapability=7
scan_mode_6ghz=2
oem_6g_support_disable=0
# 6 GHz scan duty cycle (cfg_scan.h:1433, valid [0..10], default 4):
# 4 = optimize 3/4 scans via RNR/PSC for battery, full 6 GHz scan every 4th cycle.
# (Fixed from invalid 100 which was out-of-range and silently clamped to default 4.)
scan_mode_6ghz_duty_cycle=4

# Channel bonding: 40/80/160/320 MHz on 5/6 GHz STA.
# 20 MHz on 2.4 GHz STA: BT shares the antenna (no DBAM), so a narrower WLAN
# footprint leaves Bluetooth AFH more clean channels without hurting 5/6 GHz.
gChannelBondingMode5GHz=1
gChannelBondingMode24GHz=0

# VHT Channel Width (cfg_mlme_vht_caps.h:223-227):
# 0=20MHz, 1=40MHz, 2=80MHz, 3=160MHz, 4=80+80MHz.
# (HE/EHT 320 MHz on 6 GHz is governed separately by FW capabilities.)
gVhtChannelWidth=3
gStaPrefer80MHzOver160MHz=0

# DFS, indoor, and ETSI SRD channel support (STA + SAP + P2P)
g11dSupportEnabled=0
gCountryCodePriority=0
gEnableDFSMasterCap=1
gAllowDFSChannelRoam=1
gEnableDFSPnoChnlScan=1
gEnableDFSChnlScan=1
gInitialScanNoDFSChnl=0
gDisableDFSChSwitch=0
gSkipDfsChannelInP2pSearch=0
gSapAllowAllChannel=1
gindoor_channel_support=1
# ETSI SRD channels bitmap: BIT0=SAP, BIT1=P2P-GO, BIT2=NAN (driver default: 6)
etsi13_srd_chan_in_master_mode=7
# Relaxed 6 GHz LPI/VLP connection policy (cfg_mlme_generic.h:415)
relaxed_lpi_conn_policy=1

################ 2. PHY, MIMO, Wi-Fi 6E (11ax), & Wi-Fi 7 (11be/MLO) ################

# Full 2x2 MIMO, 256-QAM / 1024-QAM (VHT MCS 9/10/11), and 4096-QAM (HE/EHT MCS 12/13)
gEnable2x2=1
gVhtRxMCS=2
gVhtTxMCS=2
gVhtRxMCS2x2=2
gVhtTxMCS2x2=2
gEnableVhtFor24GHzBand=1
enable_vhtmcs_10_11_support=1
# Keep SAP MCS 12/13 compat flag per stock; STA MCS 12/13 remains 0xffffffff
disable_mcs_12_13_sap=2

# Beamforming, STBC, and maximum A-MPDU / MPDU frame aggregation
gEnableTXSTBC=1
gEnableTxBFeeSAP=1
gEnableTxBFin20MHz=1
gEnableTxSUBeamformer=1
gEnableMuBformee=1
gVhtAmpduLenExponent=7
gVhtMpduLen=2
# RX BA window = 1024 per IEEE 802.11be (deduplicated; removed legacy 512)
gRxAggregationSize=1024
# TX BA window = 256 (max ADDBA_TXAGGR_SIZE in cfg_qos.h:28)
gTxAggregationSize=256
# Inter-MPDU spacing (cfg_mlme_ht_caps.h:370): 4 = 2 us (driver default; was 5 = 4 us).
# Packs more MPDUs per A-MPDU burst at MCS 11-13 without breaking marginal APs.
ght_mpdu_density=4

# Never throttle active MIMO or channel width during data bursts:
# - Disable HT SMPS (no 1x1 RX downgrade)
gEnableHtSMPS=0
gHtSMPS=3
# - Prevent Action OUI from forcing 1x1 MIMO on certain APs (cfg_policy_mgr.h:479)
gForce1x1Exception=0
# - Raise upper beacon RSSI threshold from 46 dB SNR (~-50 dBm) to max 66 so FW
#   does not downgrade close-range RX chainmask to 1x1 (cfg_fwol_generic.h:185)
gUpperBrssiThresh=66
# - Disable idle 160/320 MHz -> 80 MHz dynamic downgrade in FW (cfg_fwol_generic.h:259),
#   eliminating OMI bandwidth-upgrade stall at the start of high-speed bursts
dynamic_bw_switch=0
# - Replace 4-way RTS/CTS (33) on SW retries with CTS-to-Self (34): half the
#   control-frame airtime overhead while keeping collision protection (cfg_fwol_generic.h:344)
RTSThreshold=1048576
gEnableRTSProfiles=34

# Wi-Fi 6/6E (11ax) undocumented throughput unlocks (cfg_mlme_he_caps.h, cfg_mlme_generic.h):
# - Full 80/160 MHz RX preamble puncturing (0xF vs default 0x3) keeps wide channels
#   alive around sub-channel radar/interference
he_rx_pream_punc=0xF
# - Full-BW + partial-BW UL MU-MIMO (3 vs default 0) for faster multi-client uplink
he_ul_mumimo=3
# - 802.11ax/be OBSS-PD Spatial Reuse across all modes (0xF vs default 0x1;
#   verified active in Data.msc:wal_tx_sch_status.c:3402)
sr_enable_modes=0xF

# Wi-Fi 7 (11be) MLO & eMLSR unlocks (verified in Data.msc:wlan_powersave_emlsr.c):
# - 3-link tri-band MLO (deduplicated; removed stale override)
mlo_support_link_num=3
# - Enable Wi-Fi 7 eMLSR using WCN7750 LP AUX listen synth (aux_ucode.elf) for
#   instant link switching across 5 GHz + 6 GHz MLO APs (cfg_mlme_powersave.h:202)
enable_emlsr_mode=1
# - Allow WPA2/WPA3 encryption on EHT/MLO links
oem_eht_mlo_crypto_bitmap=0x3000f
# - Wi-Fi 7 EPCS, Restricted TWT (verified Data.msc:wlan_twt_sta.c:2010), & MLO Reconfig
epcs_support_enable=1
rtwt_req_resp_config=3
mlme_mlo_reconfig_reassoc_enable=1

################ 3. Hardware Bus Scaling, WDCVS, Ring Coalescing, & 64-bit WLM ################

# Interconnect Bus Bandwidth Thresholds (packets per 100 ms interval).
# Verified live in /proc/device-tree/soc/qcom,wcn7750/ddr_cfg@0/qcom,bus-bw-cfg:
#   IDLE..HIGH:  SNOC/ANOC 100 MHz, LPDDR5 547 MHz
#   VERY_HIGH:   SNOC/ANOC 200 MHz, LPDDR5 1555 MHz  (now > ~180 Mbps)
#   ULTRA_HIGH:  SNOC/ANOC 200 MHz, LPDDR5 2092 MHz  (now > ~480 Mbps; was 12000 = 1.44 Gbps)
#   SUPER_HIGH:  SNOC/ANOC 403 MHz, LPDDR5 3200 MHz  (now > ~960 Mbps; was 22000 = 2.64 Gbps)
# Drops cleanly back to 547 MHz at idle — zero standby battery cost.
gBusBandwidthVeryHighThreshold=1500
gBusBandwidthUltraHighThreshold=4000
gBusBandwidthSuperHighThreshold=8000

# Firmware Dynamic Clock & Voltage Scaling (WMI_PDEV_UPDATE_WDCVS_ALGO -> wal_wdcvs.c).
# Default 0x00000005 leaves bits 4..27 at 00 (static SVS floor) for all 11n/11ac modes.
# 0x0ffffff5 keeps 01 (LOW SVS) for legacy 11a/b/g for battery while enabling 11
# (Dynamic voltage corner based on TPUT + TX Flush counters) across all HT/VHT modes.
gConfigVCmode=0x0ffffff5

# REO_DST RX Hardware Ring Interrupt Coalescing (dp_main.c:1742-1757, dp_htt.c:1017-1021).
# Under CONFIG_WLAN_DP_PER_RING_TYPE_CONFIG=y, defaults are 512 us timer & batch=0
# (every RX burst waited up to 0.512 ms with no early packet-count interrupt).
# 64 us timer + 16-entry batch slashes latency and wakes NAPI immediately on bursts.
dp_int_timer_threshold_rx=64
dp_int_batch_threshold_rx=16

# 64-bit WLM Ultralow Latency Flags (cfg_mlme_fe_wlm.h:28-389, wlan_hdd_cfg80211.c:11257).
# Replaces Xiaomi's broken 32-bit PCIe copy (0x180003) that cleared CSLP/SSLP and all
# upper 32-bit host flags. Activates when apps hold WIFI_MODE_FULL_LOW_LATENCY:
#   Lower 32-bit FW  (0x00000c83): bit0 suppress HLOS scan, bit1 skip DFS scan,
#                                  bit7 roam on final bmiss only, bit10 disable CSLP,
#                                  bit11 disable SSLP
#   Upper 32-bit Host (0x10102):   bit33 route to LSR (0 us REO ring),
#                                  bit40 disable SWLM TX coalescing,
#                                  bit48 hold PM-QOS vote
#   Intentionally OFF: bit32 (keep DP RX threads), bit34 (keep FISA),
#                      bit49 HBB (bug in wlan_dp_bus_bandwidth.c:1502 caps DDR at VERY_HIGH!)
wlm_latency_flags_ultralow=0x1010200000c83

################ 4. Datapath Rings, Multi-Core Balancing, & Reap Uncapping ################

# RX mode 20 = CFG_ENABLE_DP_RX_THREADS (16) | CFG_ENABLE_NAPI (4)
rx_mode=20
TSOEnable=1
GROEnable=1
gEnableFlowSteering=1
maxMSDUsPerRxInd=8
gEnableSWLM=1
legacy_mode_csum_disable=1

# Large SRNG descriptor rings & page-pool RX buffer recycling
dp_tx_ring_size=5120
dp_tx_compl_ring_size=8192
dp_tx_desc=8192
dp_tx_ext_desc=8192
dp_rxdma_buf_ring=4096
dp_rxdma_refill_ring=16384
dp_rx_sw_desc_num=16384
dp_reo_dst_ring=6144
dp_reo_rings_map=0x3F
dp_rx_refill_buff_pool=1
dp_rx_buffer_recycle=1
dp_dynamic_resource_mgmt=1

# FISA (Flow-Induced Software Aggregation)
# CRITICAL HW LIMIT: WCN7750 allocates 0x5000 (20 KiB) CMEM for FSE (icnss2_qmi
# Device memory info[0]), and HAL_RX_FST_ENTRY_SIZE = 16 DWORDs = 64 B (hal_peach.c).
# Max entries = 20480 / 64 = 320 -> 256 (16 KiB) is the hard power-of-2 ceiling!
# Values >= 512 overflow CMEM into unmapped UMAC NoC -> WPSS fatal assert line#4067
# (UMAC_NOC_FABRIC_ERRORLOGGER 0xec140020) on first TCP/UDP flow hashing >= index 320.
dp_rx_fisa_enable=1
dp_rx_flow_search_table_size=256
dp_rx_fisa_lru_del_enable=1

# Dynamic per-CPU IRQ Load Balancing & FISA Flow Migration across REO rings
# (compiled in via CONFIG_WLAN_DP_LOAD/FLOW_BALANCE_SUPPORT=y, default 0)
dp_enable_load_balance=1
dp_enable_flow_balance=1

# Uncap RX/TX softirq loop limits (defaults: 64 pkts & 500 us yield).
# Setting 1024 also disables per-packet EOL checks (dp_main.c:11557-11568).
rx_reap_loop_pkt_limit=1024
tx_comp_loop_pkt_limit=1024
rx_softirq_max_yield_duration_ns=1500000
ce_service_max_rx_ind_flush=8
ce_service_max_yield_time=1000

# SM8735 CPU topology affinity: cpu0-1 A720 2.01GHz (0x03), cpu2-4 A720 3.01GHz (0x1C),
# cpu5-6 A720 2.80GHz (0x60), cpu7 X4 3.20GHz (0x80).
# 0x7C pins high-throughput TX completion IRQs (active only >= VERY_HIGH) and DP RX
# threads onto cpu2-6 performance cores, avoiding crowded cpu0-1 without waking X4.
dp_irq_affinity_mask=0x7C
RX_THREAD_CPU_AFFINITY_MASK=0x7C
RX_THREAD_UL_CPU_AFFINITY_MASK=0x7C

# Prevent cnss-daemon from dynamically overwriting BBRv3 TCP sysctls
# (tcp_limit_output_bytes, tcp_adv_win_scale; tcp_delack_seg is absent on GKI).
gTcpLimitOutputEnable=0
gTcpAdvWinScaleEnable=0
gTcpDelAckEnable=0

# Eliminate periodic 10s stats dumps, FW log spam, and debug/test overhead
# (DP trace, packet log, and ILP inspection are already compiled out in defconfig)
periodic_stats_display_time=0
gEnableUnitTestFramework=0
gEnableRingBuffer=0
gEnablefwlog=0
gFwDebugLogLevel=1
cfr_disable=7
gEnableDcs=0
dcs_debug=0

# Connectivity health & NUD tracking (deduplicated: 3 = roam on NUD fail, else disconnect)
gEnableNUDTracking=3
gEnableSelfRecovery=1
icmp_req_to_fw_mark_interval=200
gDroppedPktDisconnectTh=2047
gWmiCreditCount=1
gReportMaxLinkSpeed=2

################ 5. Battery & Standby Power Management (Zero Active Tput Penalty) ################

# Idle & Beacon Mode Power Save + Dynamic PHY Register Retention
# gEnableFastPwrTransition=2 (cfg_fwol_generic.h:154): enables PHY retention during
# active bursts for fast wake, disables retention in deep idle to save power.
gEnableImps=1
gEnableBmps=1
gEnableFastPwrTransition=2
# 1-chain RX strictly during DTIM sleep (cfg_fwol_generic.h:225; zero active RX impact)
gDtim1ChRxEnable=1
gOptimizedPowerManagement=1
enable_optimize_power=1
gEnableMemDeepSleep=1
gActiveModeOffload=1
# Green TX (default 32): lowers TX power when PER is low, auto-raises on PER rise.
# (For pure lab max-range benchmarks only, set tgt_gtx_usr_cfg=0 to disable backoff.)
tgt_gtx_usr_cfg=32

# Runtime PM (2 = auto suspend). 1000 ms delay avoids constant 1-2s bus suspend/resume
# churn observed in dmesg during bursty browsing while suspending cleanly at idle.
gRuntimePM=2
gRuntimePMDelay=1000
enable_bus_suspend_in_sap_mode=1
enable_bus_suspend_in_go_mode=1

# Suspend-only DTIM skipping (ZERO impact while screen-on / active traffic)
enable_mod_dtim_on_system_suspend=1
gEnableModulatedDTIM=5
gMaxLIModulatedDTIM=6
enable_teles_dtim_only_on_system_suspend=1
gEnableTelescopicDTIM=9

# WoW & Firmware Packet Offloads (dramatically reduce APSS wakeups during sleep)
# gEnableWoW=3 (driver default: Magic Packet + Pattern Match for APF/WoW; was 1)
gEnableWoW=3
wow_check_rx_pending_enable=1
# Hardware filter: 3 = filter broadcast + multicast in FW during sleep
gHwFilterMode=3
# APF (Android Packet Filter)
gBpfFilterEnable=1
gActiveUcBpfMode=2
gActiveMcBcBpfMode=1
# Router Advertisement (RA) filter — fixed gRArateLimitInterval from 10 (below min 60!)
gRAFilterEnable=1
gRArateLimitInterval=60
# Firmware ICMP, IGMP, & multicast replay offloads (all verified LIVE_IN_KO)
gEnableIcmpOffload=1
igmp_offload_enable=1
enable_multicast_replay_filter=1
ssdp=0

# Target Wake Time (TWT): responder enabled, no unsolicited auto-congestion teardown
enable_twt=1
twt_responder=1
twt_congestion_timeout=0
enable_twt_in_11n=1

# Power-efficient scanning & PNO prediction (faster scan completion = less radio-on time)
# Fixed gEarlyStopScanMaxThreshold from -65 (below valid min -60 in cfg_mlme_lfr.h:443!)
gEnableEarlyStopScan=1
gEarlyStopScanMinThreshold=-73
gEarlyStopScanMaxThreshold=-60
gPNOChannelPrediction=1
gChPredictionFullScanMs=120000
enable_reduce_pwr_scan=1
adaptive_dwell_mode_enabled=1
hostscan_adaptive_dwell_mode=1
active_max_channel_time_2g=60
gActiveMaxChannelTime=40
active_max_channel_time_6g=60
passive_max_channel_time_6g=60
enable_rtt_mac_randomization=1

# ############### 6. WMM / EDCA, Roaming, Concurrency, TDLS, & OUI ################

# WMM U-APSD disabled (zero polling delay on interactive packets)
InfraUapsdVoSrvIntv=0
InfraUapsdViSrvIntv=0
InfraUapsdBeSrvIntv=0
InfraUapsdBkSrvIntv=0
gAddTSWhenACMIsOff=1

# Differentiated EDCA: keep Vo/Vi low-latency while preventing Bk downloads
# from starving interactive gaming and voice frames.
gEnableEdcaParams=1
gEdcaVoCwmin=2
gEdcaViCwmin=3
gEdcaBeCwmin=4
gEdcaBkCwmin=4
gEdcaVoCwmax=3
gEdcaViCwmax=4
gEdcaBeCwmax=6
gEdcaBkCwmax=10
gEdcaVoAifs=2
gEdcaViAifs=2
gEdcaBeAifs=3
gEdcaBkAifs=7

# Roaming & band preference (deduplicated)
# Fixed gNeighborScanTimerPeriod from 500 (above valid max 300 in cfg_mlme_lfr.h:1557!)
gRrmEnable=1
FastRoamEnabled=1
RoamRssiDiff=5
gNeighborScanTimerPeriod=300
gNeighborLookupThreshold=-76
gSelect5GHzMargin=5
candidate_min_rssi_for_beacon_miss=-83
roam_data_rssi_threshold_triggers=0
roam_trigger_score_delta=9,10
gEnableSNRMonitoring=1
gtraffic_threshold=50
enable_ftopen=0
avoid_list_expiry_time=3
black_list_expiry_time=5
bad_bssid_counter_thresh=7

# Concurrency, SoftAP, P2P, NAN, & platform integration (WCN7750 is single-MAC non-DBS)
gNumVdevs=5
gSoftApMaxPeers=32
gMaxConcurrentActiveSessions=4
gWlanMccToSccSwitchMode=3
gEnableMCCAdaptiveScheduler=0
gEnableApOBSSProt=1
g_sap_sta_ndp_concurrency=0
g_sta_p2p_ndp_concurrency=0
enable_sbs=0
isP2pDeviceAddrAdministrated=0
go_ignore_non_p2p_probe_req=1
gEnableLpassSupport=1
gEnableSARV1toSARV2=1
nan_feature_config=1
acs_with_more_param=1
AutoChannelSelectWeight=0x00fafafa
read_mac_addr_from_mac_file=1
gEnableConcurrentSTA=wlan1

# TDLS direct peer-to-peer link (deduplicated; uses Xiaomi final values)
gEnableTDLSSupport=1
gTDLSExternalControl=0
gEnableTDLSOffChannel=0
gEnableTDLSImplicitTrigger=1
gTDLSRSSITriggerThreshold=-60
gTDLSRSSITeardownThreshold=-65
gTDLSRSSIDelta=-20

# Action OUI interop workarounds (keep gActionOUIDisableAuxListen at driver default
# "ffffff 00 01" — inverted logic: means DO NOT allow disabling AUX listen on any AP)
gEnableActionOUI=1
gActionOUIDisableDynamicQosNullTxRate=00e04c 03 020160 E0 01 001018 06 0205009c0000 BC 01 001018 06 0203001c0000 FC 01 000c43 04 03000000 F0 01 000c43 04 00000000 F0 01
gActionOUIITOExtension=000c43 04 00000000 F0 01 000c43 04 07000000 F0 01
gActionOUIDisableAggressiveEDCA=ac853d 00 01 0017f2 07 06010103010000 fe 01
gActionOUIAuthAssoc6Mbps2GHz=000c43 04 08000000 F0 01 000c43 04 03000000 F0 01
g_action_oui_enable_cts_2_self=000C43 04 07000000 F0 21 C0 000C43 04 03000000 F0 21 C0 8CFDF0 05 0101020100 F8 21 C0 8CFDF0 05 0109020300 F8 21 C0 8CFDF0 13 0400004900000302097201000000003f000000 FFFFE0 21 C0

################ 7. Eliminated Placebos, Dead Knobs, & Driver Traps ################
# All parameters below were audited against qca_cld3_wcn7750.ko and kernel source
# and intentionally commented out so they are not re-introduced by mistake.
#
# PLACEBO (SAP-only, zero STA effect): cfg_green_ap_params.h:61 — Enhanced Green AP
# only shuts off a chain on SoftAP with 0 clients; does nothing for STA browsing/idle.
#gEnableEGAP=1
#gEGAPInactTime=300
#gEGAPWaitTime=150
#
# PLACEBO (PCIe-only): WCN7750 on SM8735 is integrated icnss2 (CONFIG_HIF_IPCI=y),
# not discrete PCIe; PCIe Gen/L1SS switching does not apply.
#g_enable_pci_gen=1
#
# PLACEBO (unused when gEnable2x2=1): cfg_mlme_chainmask.h:36 — only read when 2x2
# is disabled; harmless noise when gEnable2x2=1.
#gSetTxChainmask1x1=1
#gSetRxChainmask1x1=1
#
# PLACEBO (not compiled into qca_cld3_wcn7750.ko): CONFIG_DP_TX_PAGE_POOL is absent
# from sun_gki_wcn7750_defconfig & Kbuild (0 symbol hits in live .ko).
#dp_tx_page_pool=1
#
# PLACEBO (dead receiver, 0 callers in qcacld-3.0): dp_main.c:12172 only sets
# soc->fst_in_cmem upon DP_SOC_PARAM_CMEM_FSE_SUPPORT, which has 0 callers in CLD3.
#dp_rx_fst_in_cmem=1
#
# PLACEBO (ignored under CONFIG_WLAN_DP_PER_RING_TYPE_CONFIG=y): dp_main.c:1805 uses
# hardcoded wlan_srng_wbm_release_cfg (tuned to 64 us in cfg_dp.h:188 instead).
#dp_int_timer_threshold_tx=64
#
# PLACEBO (IPA disabled on non-MDM Android): CONFIG_IPA_OFFLOAD=n in wcn7750 build.
#gIPAConfig=0
#
# PLACEBO (overridden at runtime): wlan_dp_rx_thread.c:1591 ignores this INI and
# derives thread count from cdp_get_num_rx_contexts(soc) (dp_reo_rings_map=0x3F).
#num_dp_rx_threads=4
#
# PLACEBO (myth — does NOT raise TX power): wlan_hdd_cfg.c:343-373 only uses
# gPowerUsage="Min"/"Max" to select BMPS listen_interval.
#gPowerUsage=Max
#
# PLACEBO (0 active C callers in qcacld-3.0): defined only in cfg_cmn_mlme.h:95.
#non_mlo_11be_ap_operation_enable=1
#
# TRAP (WCN7750 CMEM FSE overflow -> WPSS crash): hal_peach.c unconditionally maps
# FST into WCN7750 20 KiB CMEM (0x5000 / 64 B = 320 entries max -> 256 power-of-2 cap).
# Setting dp_rx_flow_search_table_size=512..2048 overflows CMEM and triggers
# UMAC_NOC_FABRIC_ERRORLOGGER (0xec140020, cmnos_assert.c:411 line#4067) on connect!
#dp_rx_flow_search_table_size=2048
#
# TRAP (hurts BBRv3 pacing): gEnableTxOrphan=1 calls skb_orphan() early in
# wlan_dp_txrx.h:420, breaking Linux TCP Small Queues (sk_wmem_alloc) feedback that
# BBRv3 relies on for low-bufferbloat uplink pacing.
#gEnableTxOrphan=1
#
# TRAP (WLM bit 49 HBB caps DDR at VERY_HIGH): wlan_dp_bus_bandwidth.c:1502 checks
# dp_ctx->high_bus_bw_request BEFORE SUPER_HIGH/ULTRA_HIGH in an if/else-if chain,
# locking DDR to 1555 MHz and preventing 2092/3200 MHz! Keep bit 49 = 0.
#
# TRAP (already maxed at shift=4 -> 1024 pkts/poll): hif.h:271 sets
# QCA_NAPI_DEF_SCALE_BIN_SHIFT=4 when NAPI_YIELD_BUDGET_BASED is unset (default 0).
#dp_napi_scale_factor=4
#
# COMPILED OUT IN qca_cld3_wcn7750.ko (verified 0 hits in freshly built .ko;
# commented out so cfg_ini parser emits zero unknown-key warnings on boot):
# - gEnableFastPath: guarded by #ifdef WLAN_FEATURE_FASTPATH (wlan_dp_cfg.h:1015,
#   legacy non-Beryllium fastpath; WCN7750 uses native SRNG datapath).
# - gEnablePacketLog: guarded by #ifndef REMOVE_PKT_LOG (hdd_config.h:569;
#   CONFIG_REMOVE_PKT_LOG=y in sun_gki_wcn7750_defconfig).
# - tx_pkt_inspect_for_ilp: guarded by #ifdef DP_TX_PACKET_INSPECT_FOR_ILP
#   (cfg_dp.h:2278, unset in sun_gki_wcn7750_defconfig).
# - enable_dp_trace / dp_proto_event_bitmap: guarded by #ifdef CONFIG_DP_TRACE
#   (wlan_dp_cfg.h:1053; compiled out in sun_gki_wcn7750_defconfig for zero hot-path cost).
#gEnableFastPath=1
#gEnablePacketLog=0
#tx_pkt_inspect_for_ilp=0
#enable_dp_trace=0
#dp_proto_event_bitmap=0
#
# DEAD XIAOMI-PROPRIETARY KEYS (verified ABSENT from qca_cld3_wcn7750.ko binary and
# open-source qcacld-3.0 headers; parser silently drops them on boot):
#gApChannelBondingMode24GHz=1
#gApChannelBondingMode5GHz=1
#gApChannelBondingMode6GHz=1
#eht_mlo_crypto_open_allow=0x1
#gEnableNUDFailureNotify=4
#gEnableBmissNoity=1
#gBmpsModListenInterval=8

END

# Note: Configuration parser would not read anything past the END marker
